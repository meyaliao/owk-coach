<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>老玩客教練卡</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap">
<link rel="stylesheet" href="style.css">
<style>
body{ display:flex; align-items:center; justify-content:center; min-height:100vh; }
.home{ text-align:center; padding:32px 24px; max-width:400px; }
.home-logo{ font-size:56px; margin-bottom:16px }
.home h1{ font-size:22px; font-weight:700; color:var(--fg); margin-bottom:6px }
.home p{ font-size:14px; color:var(--fg2); margin-bottom:32px }
.class-links{ display:flex; flex-direction:column; gap:12px; }
.class-link{
  display:block; padding:16px 24px;
  background:var(--surface); border:1px solid var(--border);
  border-radius:var(--radius); text-decoration:none;
  color:var(--fg); font-weight:700; font-size:16px;
  transition:border-color .15s, box-shadow .15s;
}
.class-link:hover{ border-color:var(--accent); box-shadow:0 2px 8px rgba(45,106,79,.12); }
.class-link span{ display:block; font-size:12px; font-weight:400; color:var(--fg2); margin-top:2px; }
</style>
</head>
<body>
<div class="home">
  <div class="home-logo">🏃</div>
  <h1>老玩客教練卡</h1>
  <p>請選擇您的課堂班別</p>
  <div class="class-links">
    <a class="class-link" href="wed/">週三班 <span>點此查看週三課堂學員資料</span></a>
    <a class="class-link" href="fri/">週五班 <span>點此查看週五課堂學員資料</span></a>
  </div>
</div>
</body>
</html>
